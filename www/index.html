<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>K-EDIT STUDIO</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header id="topbar">
    <div class="topbar-left">
      <button id="btn-home" class="icon-btn" title="Projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <span id="project-name" contenteditable="true">Untitled Project</span>
    </div>
    <div class="topbar-center">
      <button id="btn-undo" class="icon-btn" disabled title="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button id="btn-redo" class="icon-btn" disabled title="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
    </div>
    <div class="topbar-right">
      <button id="btn-ai" class="tool-btn">AI Tools</button>
      <button id="btn-export" class="primary-btn">Export</button>
    </div>
  </header>

  <main id="workspace">
    <section id="preview-area">
      <div id="preview-container">
        <video id="preview-video" playsinline webkit-playsinline></video>
        <canvas id="preview-canvas"></canvas>
        <div id="preview-overlay"></div>
        <div id="preview-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg>
          <p>Import media to start editing</p>
        </div>
      </div>
      <div id="transport">
        <button id="btn-skip-back" class="icon-btn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="play-btn" title="Play/Pause">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-skip-forward" class="icon-btn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/></svg>
        </button>
        <div id="timecode">
          <span id="current-time">00:00.00</span>
          <span class="sep">/</span>
          <span id="total-time">00:00.00</span>
        </div>
        <div id="zoom-controls">
          <button id="btn-zoom-out" class="icon-btn-sm">−</button>
          <input type="range" id="timeline-zoom" min="1" max="100" value="30" />
          <button id="btn-zoom-in" class="icon-btn-sm">+</button>
        </div>
      </div>
    </section>

    <section id="timeline-section">
      <div id="timeline-header">
        <div class="track-labels">
          <div class="track-label" data-track="video">V1</div>
          <div class="track-label" data-track="overlay">OL</div>
          <div class="track-label" data-track="text">TX</div>
          <div class="track-label" data-track="audio">A1</div>
        </div>
        <div id="timeline-ruler-wrap">
          <canvas id="timeline-ruler"></canvas>
        </div>
      </div>
      <div id="timeline-body">
        <div class="track-labels sticky">
          <div class="track-label" data-track="video">Video</div>
          <div class="track-label" data-track="overlay">Overlay</div>
          <div class="track-label" data-track="text">Text</div>
          <div class="track-label" data-track="audio">Audio</div>
        </div>
        <div id="tracks-container">
          <div class="track" id="track-video" data-type="video"></div>
          <div class="track" id="track-overlay" data-type="overlay"></div>
          <div class="track" id="track-text" data-type="text"></div>
          <div class="track" id="track-audio" data-type="audio"></div>
          <div id="playhead"></div>
        </div>
      </div>
    </section>
  </main>

  <nav id="toolbar">
    <button class="tool" data-tool="import" id="tool-import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Import</span>
    </button>
    <button class="tool" data-tool="trim" id="tool-trim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v18M18 3v18M3 6h18M3 18h18"/></svg>
      <span>Trim</span>
    </button>
    <button class="tool" data-tool="split" id="tool-split">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Split</span>
    </button>
    <button class="tool" data-tool="speed" id="tool-speed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Speed</span>
    </button>
    <button class="tool" data-tool="filters" id="tool-filters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span>Filters</span>
    </button>
    <button class="tool" data-tool="text" id="tool-text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span>Text</span>
    </button>
    <button class="tool" data-tool="audio" id="tool-audio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>Audio</span>
    </button>
    <button class="tool" data-tool="effects" id="tool-effects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>Effects</span>
    </button>
  </nav>

  <aside id="panel" class="hidden">
    <div class="panel-header">
      <h3 id="panel-title">Tools</h3>
      <button id="panel-close" class="icon-btn">×</button>
    </div>
    <div id="panel-content"></div>
  </aside>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Export</h3>
        <button id="modal-close" class="icon-btn">×</button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="tool-btn">Cancel</button>
        <button id="modal-confirm" class="primary-btn">Confirm</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-video" accept="video/*" multiple hidden />
  <input type="file" id="file-image" accept="image/*" multiple hidden />
  <input type="file" id="file-audio" accept="audio/*" multiple hidden />

  <script type="module" src="js/main.js"></script>
</body>
</html>
